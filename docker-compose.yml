services:
  web:
    build: .
    restart: always
    ports:
      - "127.0.0.1:8004:8000" # <--- ПОРТ 8004
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./db.sqlite3:/app/db.sqlite3 # Монтируем файл базы, чтобы он не терялся
      - ./static:/app/static
      - ./media:/app/media